<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>HealthAccess API reference</title>
  <meta name="description" content="Endpoint reference and request runner for the HealthAccess online API." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%230b6b5f'/%3E%3Cpath%20d='M16%206%209%208.6v5.1c0%204.2%202.8%207.4%207%209.3%204.2-1.9%207-5.1%207-9.3V8.6L16%206Z'%20fill='none'%20stroke='white'%20stroke-width='1.8'/%3E%3C/svg%3E" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("healthaccess.apiDocs.theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved === "dark" || saved === "light" ? saved : (prefersDark ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <style>
:root {
  color-scheme: light;
  --font-ui: "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SFMono-Regular", ui-monospace, "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;

  --bg: #f4f7f5;
  --surface: #ffffff;
  --surface-2: #f7faf8;
  --surface-3: #edf2ef;
  --ink: #11201c;
  --ink-2: #34443e;
  --muted: #61716b;
  --faint: #87958f;
  --border: #dce5e1;
  --border-strong: #c7d4ce;

  --accent: #0c6e58;
  --accent-hover: #095a48;
  --accent-weak: #e4f2ec;
  --accent-ink: #075744;
  --accent-line: #b9ddd1;
  --focus: #127a66;
  --focus-ring: rgba(18, 122, 102, 0.18);

  --shadow-sm: 0 1px 1px rgba(17, 32, 28, 0.04);
  --shadow: 0 1px 2px rgba(17, 32, 28, 0.04), 0 10px 28px rgba(17, 32, 28, 0.05);

  --code-bg: #0d1916;
  --code-bg-2: #0a1411;
  --code-ink: #d9e6e1;
  --code-line: #22322c;
  --tok-key: #8ad9c1;
  --tok-string: #e7d4a6;
  --tok-number: #9dc7f0;
  --tok-boolean: #c8a9ee;
  --tok-null: #8fa49c;
  --tok-punct: #9db0a9;

  --get: #0a5b46;
  --get-bg: #e3f2ec;
  --get-line: #c6e5d9;
  --post: #855000;
  --post-bg: #faeedb;
  --post-line: #eed7b0;
  --put: #1f568f;
  --put-bg: #e6eef8;
  --put-line: #c9dcf0;
  --patch: #65419c;
  --patch-bg: #f0eaf9;
  --patch-line: #ddcff0;
  --delete: #9c2f27;
  --delete-bg: #fae9e7;
  --delete-line: #f0cdc8;

  --ok: #0a6b4f;
  --ok-bg: #e3f4ec;
  --ok-line: #c4e6d8;
  --info: #1f568f;
  --info-bg: #e6eef8;
  --info-line: #c9dcf0;
  --warn: #855000;
  --warn-bg: #faeedb;
  --warn-line: #eed7b0;
  --danger: #9c2f27;
  --danger-bg: #fae9e7;
  --danger-line: #f0cdc8;

  --topbar-h: 69px;
  --radius-sm: 7px;
  --radius: 11px;
  --radius-lg: 15px;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b1311;
  --surface: #111b18;
  --surface-2: #15211d;
  --surface-3: #1a2823;
  --ink: #e9f0ed;
  --ink-2: #c3d0cb;
  --muted: #92a29c;
  --faint: #6f817a;
  --border: #24332e;
  --border-strong: #32453e;

  --accent: #4dc2a3;
  --accent-hover: #70d5ba;
  --accent-weak: #102e26;
  --accent-ink: #84dcc3;
  --accent-line: #1f4a3d;
  --focus: #5ed0b1;
  --focus-ring: rgba(94, 208, 177, 0.2);

  --shadow-sm: 0 1px 1px rgba(0, 0, 0, 0.2);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 14px 34px rgba(0, 0, 0, 0.24);

  --code-bg: #081210;
  --code-bg-2: #060f0d;
  --code-ink: #d5e3de;
  --code-line: #1c2b26;

  --get: #7fe0c2;
  --get-bg: #10352b;
  --get-line: #1c4a3d;
  --post: #f0c07d;
  --post-bg: #35270f;
  --post-line: #51401e;
  --put: #9ecbf4;
  --put-bg: #13283c;
  --put-line: #23415d;
  --patch: #c9b0f0;
  --patch-bg: #261e39;
  --patch-line: #3d3057;
  --delete: #f2a69e;
  --delete-bg: #381b18;
  --delete-line: #57302b;

  --ok: #82dfbd;
  --ok-bg: #0f3328;
  --ok-line: #1d4a3b;
  --info: #a3cdf4;
  --info-bg: #12283c;
  --info-line: #23415c;
  --warn: #f0c482;
  --warn-bg: #33260f;
  --warn-line: #51401e;
  --danger: #f2a69e;
  --danger-bg: #381b18;
  --danger-line: #57302b;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1,
h2,
h3,
p,
ul,
ol,
figure {
  margin: 0;
}

ul,
ol {
  padding: 0;
}

button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

a {
  color: var(--accent-ink);
  text-underline-offset: 3px;
}

a:hover {
  color: var(--accent);
}

svg {
  display: block;
  flex: none;
}

code,
kbd,
pre,
samp {
  font-family: var(--font-mono);
}

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

::selection {
  background: var(--accent-weak);
  color: var(--ink);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 200;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: var(--ink);
  color: var(--bg);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  transform: translateY(-160%);
  transition: transform 160ms ease;
}

.skip-link:focus {
  transform: none;
  color: var(--bg);
}

/* Top bar */

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255, 255, 255, 0.9);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

[data-theme="dark"] .topbar {
  background: rgba(17, 27, 24, 0.9);
}

.topbar-inner {
  display: flex;
  align-items: center;
  gap: 16px;
  max-width: 1600px;
  margin: 0 auto;
  padding: 11px 24px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
  color: var(--ink);
  text-decoration: none;
}

.brand:hover {
  color: var(--ink);
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  flex: none;
  border-radius: 10px;
  background: var(--accent);
  color: #ffffff;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
}

[data-theme="dark"] .brand-mark {
  color: #06231c;
}

.brand-mark svg {
  width: 22px;
  height: 22px;
}

.brand-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
  line-height: 1.2;
}

.brand-title {
  font-size: 15.5px;
  font-weight: 680;
  letter-spacing: -0.015em;
  white-space: nowrap;
}

.brand-title span {
  color: var(--muted);
  font-weight: 550;
}

.brand-sub {
  margin-top: 2px;
  color: var(--faint);
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}

.version-badge {
  flex: none;
  padding: 2px 7px;
  border: 1px solid var(--accent-line);
  border-radius: 999px;
  background: var(--accent-weak);
  color: var(--accent-ink);
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.topbar-fields {
  display: flex;
  flex: 1 1 auto;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  min-width: 0;
}

.env-field {
  display: flex;
  flex-direction: column;
  gap: 1px;
  width: 100%;
  max-width: 300px;
  min-width: 0;
  padding: 4px 11px 5px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface-2);
  cursor: text;
}

.env-field:hover {
  border-color: var(--border-strong);
}

.env-field:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--focus-ring);
}

.field-caption {
  color: var(--faint);
  font-size: 9.5px;
  font-weight: 650;
  letter-spacing: 0.04em;
  line-height: 1.3;
  text-transform: uppercase;
}

.env-input {
  width: 100%;
  min-width: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--ink-2);
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.5;
  text-overflow: ellipsis;
}

.env-input:focus {
  outline: none;
}

.search-field {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  max-width: 300px;
  min-width: 0;
  height: 43px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface-2);
}

.search-field:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--focus-ring);
}

.search-field > svg {
  width: 15px;
  height: 15px;
  color: var(--faint);
}

.search-field input {
  flex: 1;
  width: 100%;
  min-width: 0;
  border: 0;
  background: transparent;
  font-size: 12.5px;
}

.search-field input:focus {
  outline: none;
}

.search-field input::placeholder {
  color: var(--faint);
}

.search-field input::-webkit-search-cancel-button,
.search-field input::-webkit-search-decoration {
  -webkit-appearance: none;
  appearance: none;
}

.key-hint {
  flex: none;
  min-width: 20px;
  padding: 1px 5px;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  background: var(--surface);
  color: var(--faint);
  font-size: 10px;
  line-height: 1.5;
  text-align: center;
}

.search-field:focus-within .key-hint {
  display: none;
}

.search-clear {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  flex: none;
  padding: 0;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--muted);
}

.search-clear:hover {
  background: var(--surface-3);
  color: var(--ink);
}

.search-clear svg {
  width: 12px;
  height: 12px;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
}

.icon-button {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface);
  color: var(--ink-2);
  transition: background 140ms ease, border-color 140ms ease, color 140ms ease;
}

.icon-button:hover {
  border-color: var(--border-strong);
  background: var(--surface-2);
  color: var(--ink);
}

.icon-button svg {
  width: 17px;
  height: 17px;
}

.icon-button[aria-expanded="true"] {
  border-color: var(--accent-line);
  background: var(--accent-weak);
  color: var(--accent-ink);
}

.nav-toggle {
  display: none;
}

.theme-toggle .icon-sun,
.theme-toggle .icon-moon {
  grid-area: 1 / 1;
}

[data-theme="light"] .theme-toggle .icon-moon {
  display: none;
}

[data-theme="dark"] .theme-toggle .icon-sun {
  display: none;
}

/* Layout */

.layout {
  display: grid;
  grid-template-columns: 296px minmax(0, 1fr);
  gap: 0;
  max-width: 1600px;
  margin: 0 auto;
  padding: 0 24px;
}

.sidebar {
  position: sticky;
  top: calc(var(--topbar-h) + 18px);
  align-self: start;
  height: calc(100vh - var(--topbar-h) - 36px);
  padding: 14px 16px 26px 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  border-right: 1px solid var(--border);
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}

.sidebar::-webkit-scrollbar {
  width: 8px;
}

.sidebar::-webkit-scrollbar-thumb {
  border: 2px solid var(--bg);
  border-radius: 999px;
  background: var(--border-strong);
}

.sidebar-heading {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 10px 10px;
}

.sidebar-label {
  color: var(--ink-2);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.035em;
  text-transform: uppercase;
}

.sidebar-count {
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 10.5px;
  margin-left: auto;
}

.sidebar-close {
  display: none;
}

.endpoint-nav {
  padding-bottom: 8px;
}

.nav-group + .nav-group {
  margin-top: 13px;
}

.nav-group-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin: 0;
  padding: 7px 10px 5px;
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 650;
  letter-spacing: 0.015em;
}

.nav-group-count {
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
}

.nav-list {
  list-style: none;
  margin: 0;
}

.nav-list li {
  margin: 1px 0;
}

.endpoint-link {
  position: relative;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 9px 7px 8px;
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--ink-2);
  text-decoration: none;
  transition: background 120ms ease, border-color 120ms ease;
}

.endpoint-link:hover {
  background: var(--surface);
  border-color: var(--border);
  color: var(--ink);
}

.endpoint-link[aria-current="page"] {
  background: var(--accent-weak);
  border-color: var(--accent-line);
  color: var(--ink);
}

.endpoint-link[aria-current="page"]::before {
  content: "";
  position: absolute;
  top: 8px;
  bottom: 8px;
  left: -1px;
  width: 2px;
  border-radius: 2px;
  background: var(--accent);
}

.endpoint-link-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
  line-height: 1.25;
}

.endpoint-link-name {
  overflow: hidden;
  font-size: 12.5px;
  font-weight: 560;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.endpoint-link-path {
  margin-top: 2px;
  overflow: hidden;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sidebar-empty {
  padding: 22px 10px;
  color: var(--muted);
  font-size: 12.5px;
}

.sidebar-empty strong {
  display: block;
  margin-bottom: 4px;
  color: var(--ink-2);
  font-size: 13px;
  font-weight: 600;
}

.sidebar-empty p {
  overflow-wrap: anywhere;
}

.sidebar-foot {
  margin-top: 14px;
  padding: 12px 10px 0;
  border-top: 1px solid var(--border);
  color: var(--faint);
  font-size: 10.5px;
  line-height: 1.6;
}

.sidebar-foot code {
  font-size: 10px;
}

.main {
  min-width: 0;
  padding: 24px 0 80px clamp(26px, 3vw, 46px);
}

.drawer-backdrop {
  display: none;
}

/* Method and status badges */

.method-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 48px;
  padding: 3px 7px;
  border: 1px solid transparent;
  border-radius: 5px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.035em;
  line-height: 1.5;
  text-align: center;
}

.method-get {
  color: var(--get);
  background: var(--get-bg);
  border-color: var(--get-line);
}

.method-post {
  color: var(--post);
  background: var(--post-bg);
  border-color: var(--post-line);
}

.method-put {
  color: var(--put);
  background: var(--put-bg);
  border-color: var(--put-line);
}

.method-patch {
  color: var(--patch);
  background: var(--patch-bg);
  border-color: var(--patch-line);
}

.method-delete {
  color: var(--delete);
  background: var(--delete-bg);
  border-color: var(--delete-line);
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border: 1px solid transparent;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 650;
  white-space: nowrap;
}

.status-pill::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.status-2xx {
  color: var(--ok);
  background: var(--ok-bg);
  border-color: var(--ok-line);
}

.status-3xx {
  color: var(--info);
  background: var(--info-bg);
  border-color: var(--info-line);
}

.status-4xx {
  color: var(--warn);
  background: var(--warn-bg);
  border-color: var(--warn-line);
}

.status-5xx {
  color: var(--danger);
  background: var(--danger-bg);
  border-color: var(--danger-line);
}

/* Endpoint header */

.endpoint-head {
  position: sticky;
  top: var(--topbar-h);
  z-index: 20;
  margin: 0 0 0 -8px;
  padding: 18px 8px 20px;
  border-bottom: 1px solid var(--border);
  background: rgba(244, 247, 245, 0.94);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

[data-theme="dark"] .endpoint-head {
  background: rgba(11, 19, 17, 0.94);
}

.endpoint-kicker {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  margin-bottom: 12px;
}

.endpoint-path {
  min-width: 0;
  overflow-wrap: anywhere;
  color: var(--ink-2);
  font-family: var(--font-mono);
  font-size: 13.5px;
  font-weight: 550;
}

.kicker-copy {
  flex: none;
}

.group-chip {
  margin-left: auto;
  padding: 2px 8px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 550;
  white-space: nowrap;
}

.endpoint-head h1 {
  max-width: 34ch;
  font-size: clamp(23px, 2.4vw, 29px);
  font-weight: 670;
  letter-spacing: -0.022em;
  line-height: 1.22;
}

.endpoint-summary {
  max-width: 72ch;
  margin-top: 8px;
  color: var(--muted);
  font-size: 14.5px;
  line-height: 1.55;
}

.endpoint-badges {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 14px;
}

.auth-badge,
.meta-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  font-size: 11px;
  font-weight: 550;
  line-height: 1.6;
  white-space: nowrap;
}

.auth-badge svg {
  width: 12px;
  height: 12px;
}

.auth-bearer {
  border-color: var(--accent-line);
  background: var(--accent-weak);
  color: var(--accent-ink);
}

.meta-chip code {
  font-size: 10.5px;
}

.role-chip {
  border-color: var(--border-strong);
  background: var(--surface-3);
  color: var(--ink-2);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.02em;
}

/* Content sections */

.endpoint-body {
  padding-top: 4px;
}

.doc-section {
  margin-top: 34px;
}

.doc-section > h2 {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  color: var(--ink);
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.012em;
}

.section-note {
  margin: -4px 0 12px;
  color: var(--muted);
  font-size: 12.5px;
}

.prose {
  max-width: 74ch;
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.68;
}

.prose p + p {
  margin-top: 10px;
}

.prose code,
.callout code,
.notes code,
.section-note code,
.sidebar-foot code {
  padding: 1px 4px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--ink-2);
  font-size: 0.9em;
}

.callout {
  display: flex;
  gap: 12px;
  max-width: 76ch;
  padding: 13px 15px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 13px;
  line-height: 1.6;
}

.callout > svg {
  width: 16px;
  height: 16px;
  margin-top: 2px;
  color: var(--accent);
}

.callout strong {
  color: var(--ink);
  font-weight: 620;
}

/* Tables */

.table-wrap {
  max-width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}

.param-table {
  width: 100%;
  min-width: 620px;
  border-collapse: collapse;
  font-size: 12.8px;
  text-align: left;
}

.param-table th {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: 0.03em;
  white-space: nowrap;
  text-transform: uppercase;
}

.param-table td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--ink-2);
  vertical-align: top;
}

.param-table tr:last-child td {
  border-bottom: 0;
}

.param-table tbody tr:hover {
  background: var(--surface-2);
}

.param-table td:first-child {
  width: 22%;
}

.param-table td:nth-child(2) {
  width: 15%;
}

.param-table td:nth-child(3) {
  width: 10%;
}

.param-name {
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.param-desc {
  min-width: 220px;
  line-height: 1.55;
}

.param-desc code {
  padding: 0 3px;
  border-radius: 3px;
  background: var(--surface-3);
  font-size: 11px;
}

.type-chip {
  display: inline-block;
  padding: 1px 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--accent-ink);
  font-family: var(--font-mono);
  font-size: 10.5px;
  white-space: nowrap;
}

.req-flag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 550;
  white-space: nowrap;
}

.req-yes {
  color: var(--ink-2);
}

.req-yes::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
}

.req-no {
  color: var(--faint);
}

.default-note {
  display: block;
  margin-top: 3px;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 10px;
}

.body-format-note {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
  color: var(--muted);
  font-size: 12px;
}

.body-format-note code {
  padding: 1px 5px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--ink-2);
  font-size: 10.5px;
}

/* Panels, tabs, code */

.panel {
  max-width: 100%;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.panel-head {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: space-between;
  min-height: 49px;
  padding: 7px 9px 7px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.panel-head-title {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 600;
}

.panel-head-title svg {
  width: 14px;
  height: 14px;
  color: var(--faint);
}

.tablist-shell {
  display: flex;
  gap: 2px;
  min-width: 0;
  padding: 2px;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-2);
  scrollbar-width: none;
}

.tablist-shell::-webkit-scrollbar {
  display: none;
}

.tab {
  flex: none;
  padding: 5px 10px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 550;
  line-height: 1.5;
  white-space: nowrap;
  transition: background 120ms ease, color 120ms ease;
}

.tab:hover {
  color: var(--ink);
}

.tab[aria-selected="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 0 0 1px var(--border), var(--shadow-sm);
  font-weight: 620;
}

.tab:focus-visible {
  outline-offset: 1px;
}

.copy-button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex: none;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 550;
  line-height: 1.6;
  transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
}

.copy-button:hover {
  border-color: var(--border-strong);
  background: var(--surface-2);
  color: var(--ink);
}

.copy-button svg {
  width: 12px;
  height: 12px;
}

.copy-button.is-copied {
  border-color: var(--accent-line);
  background: var(--accent-weak);
  color: var(--accent-ink);
}

.code-block {
  position: relative;
  margin: 0;
  padding: 16px 18px;
  overflow: auto;
  background: var(--code-bg);
  color: var(--code-ink);
  font-size: 12px;
  line-height: 1.7;
  tab-size: 2;
  scrollbar-width: thin;
  scrollbar-color: #34463f transparent;
}

.code-block code {
  display: block;
  min-width: max-content;
  font-family: var(--font-mono);
  white-space: pre;
}

.code-block--scroll {
  max-height: 430px;
}

.code-block--tall {
  max-height: 560px;
}

.code-block::selection,
.code-block *::selection {
  background: #2a4a40;
}

.tok-key {
  color: var(--tok-key);
}

.tok-string {
  color: var(--tok-string);
}

.tok-number {
  color: var(--tok-number);
}

.tok-boolean {
  color: var(--tok-boolean);
}

.tok-null {
  color: var(--tok-null);
  font-style: italic;
}

.tok-punct {
  color: var(--tok-punct);
}

.code-empty {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 88px;
  padding: 18px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 12.5px;
}

.code-empty svg {
  width: 15px;
  height: 15px;
  color: var(--faint);
}

.tab-panel[hidden] {
  display: none;
}

/* Responses */

.response-panel {
  box-shadow: var(--shadow-sm);
}

.response-tabs {
  padding: 9px 10px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}

.response-tablist {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}

.response-tablist::-webkit-scrollbar {
  display: none;
}

.status-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
  padding: 5px 10px;
  border: 1px solid transparent;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.5;
  white-space: nowrap;
}

.status-tab:hover {
  background: var(--surface);
  color: var(--ink);
}

.status-tab .status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.status-tab .status-code {
  font-family: var(--font-mono);
  font-weight: 650;
}

.status-tab .status-label {
  font-size: 11px;
  opacity: 0.85;
}

.status-tab[aria-selected="true"] {
  border-color: var(--border);
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}

.status-tab.status-2xx[aria-selected="true"] {
  border-color: var(--ok-line);
  background: var(--ok-bg);
  color: var(--ok);
}

.status-tab.status-3xx[aria-selected="true"] {
  border-color: var(--info-line);
  background: var(--info-bg);
  color: var(--info);
}

.status-tab.status-4xx[aria-selected="true"] {
  border-color: var(--warn-line);
  background: var(--warn-bg);
  color: var(--warn);
}

.status-tab.status-5xx[aria-selected="true"] {
  border-color: var(--danger-line);
  background: var(--danger-bg);
  color: var(--danger);
}

.response-body {
  min-width: 0;
}

.response-summary {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 13px 14px;
  border-bottom: 1px solid var(--border);
}

.response-summary-text {
  flex: 1;
  min-width: 0;
}

.response-summary-text p {
  color: var(--ink-2);
  font-size: 12.5px;
  line-height: 1.55;
}

.response-summary-text .response-meta {
  margin-top: 4px;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 10.5px;
}

.headers-block {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}

.headers-block h3 {
  margin-bottom: 6px;
  color: var(--faint);
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.headers-grid {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 3px 16px;
  margin: 0;
  font-family: var(--font-mono);
  font-size: 10.5px;
  line-height: 1.6;
}

.headers-grid dt {
  color: var(--muted);
  overflow-wrap: anywhere;
}

.headers-grid dd {
  margin: 0;
  color: var(--ink-2);
  overflow-wrap: anywhere;
}

.no-headers {
  color: var(--faint);
  font-size: 11px;
}

/* Try it */

.tryit-panel {
  border-color: var(--accent-line);
}

.tryit-panel .panel-head {
  border-bottom-color: var(--accent-line);
}

.live-flag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 7px;
  border: 1px solid var(--accent-line);
  border-radius: 999px;
  background: var(--accent-weak);
  color: var(--accent-ink);
  font-size: 9.5px;
  font-weight: 650;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.live-flag::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
}

.tryit-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 16px;
  padding: 14px;
}

.tryit-form {
  display: flex;
  flex-direction: column;
  gap: 13px;
  min-width: 0;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}

.field-label {
  display: flex;
  align-items: baseline;
  gap: 7px;
  color: var(--ink-2);
  font-size: 11.5px;
  font-weight: 600;
}

.field-label .field-optional {
  color: var(--faint);
  font-size: 10px;
  font-weight: 500;
}

.field-hint {
  color: var(--faint);
  font-size: 10.5px;
  line-height: 1.5;
}

.input-shell {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  padding: 0 9px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface-2);
  transition: border-color 120ms ease, box-shadow 120ms ease;
}

.input-shell:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--focus-ring);
}

.input-shell input {
  width: 100%;
  min-width: 0;
  height: 34px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 11.5px;
}

.input-shell input:focus {
  outline: none;
}

.input-shell .reveal-button {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  flex: none;
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--faint);
}

.input-shell .reveal-button:hover {
  background: var(--surface-3);
  color: var(--ink);
}

.input-shell .reveal-button svg {
  width: 12px;
  height: 12px;
}

.field-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.textarea-shell {
  min-width: 0;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface-2);
  transition: border-color 120ms ease, box-shadow 120ms ease;
}

.textarea-shell:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--focus-ring);
}

.textarea-shell textarea {
  display: block;
  width: 100%;
  min-width: 0;
  min-height: 162px;
  padding: 0;
  resize: vertical;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.65;
  tab-size: 2;
}

.textarea-shell textarea:focus {
  outline: none;
}

.textarea-shell textarea:disabled {
  color: var(--faint);
  opacity: 0.7;
}

.field-error {
  display: none;
  color: var(--delete);
  font-size: 10.5px;
  line-height: 1.5;
}

.field-error.is-visible {
  display: block;
}

.request-url {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 7px 9px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface-2);
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1.5;
}

.request-url .request-url-method {
  flex: none;
  color: var(--accent-ink);
  font-weight: 650;
}

.request-url code {
  min-width: 0;
  overflow-wrap: anywhere;
  color: var(--ink-2);
}

.tryit-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.send-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 36px;
  padding: 7px 14px;
  border: 1px solid transparent;
  border-radius: 7px;
  background: var(--accent);
  color: #ffffff;
  font-size: 12px;
  font-weight: 620;
  line-height: 1.5;
  transition: background 120ms ease, transform 80ms ease;
}

[data-theme="dark"] .send-button {
  color: #06231c;
}

.send-button:hover {
  background: var(--accent-hover);
}

.send-button:active {
  transform: translateY(1px);
}

.send-button:disabled {
  cursor: progress;
  opacity: 0.75;
}

.send-button svg {
  width: 13px;
  height: 13px;
}

.send-button .spinner {
  width: 12px;
  height: 12px;
  border-width: 2px;
  border-color: rgba(255, 255, 255, 0.35);
  border-top-color: #ffffff;
}

[data-theme="dark"] .send-button .spinner {
  border-color: rgba(6, 35, 28, 0.3);
  border-top-color: #06231c;
}

.send-hint {
  color: var(--faint);
  font-size: 10px;
}

.tryit-token-note {
  color: var(--faint);
  font-size: 10.5px;
  line-height: 1.5;
}

.tryit-result {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
}

.tryit-result-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  min-height: 45px;
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}

.tryit-result-title {
  color: var(--ink-2);
  font-size: 11px;
  font-weight: 650;
}

.tryit-result-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-left: auto;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 10px;
}

.tryit-result-body {
  flex: 1;
  min-width: 0;
}

.result-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 236px;
  padding: 24px;
  color: var(--faint);
  text-align: center;
}

.result-placeholder svg {
  width: 22px;
  height: 22px;
  color: var(--border-strong);
}

.result-placeholder strong {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}

.result-placeholder p {
  max-width: 34ch;
  font-size: 11px;
  line-height: 1.55;
}

.result-loading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 236px;
  color: var(--muted);
  font-size: 12px;
}

.spinner {
  width: 15px;
  height: 15px;
  border: 2px solid var(--border-strong);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 700ms linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.result-error {
  padding: 16px;
}

.result-error-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  color: var(--delete);
  font-size: 12.5px;
  font-weight: 650;
}

.result-error-head svg {
  width: 15px;
  height: 15px;
}

.result-error p {
  color: var(--ink-2);
  font-size: 11.5px;
  line-height: 1.6;
}

.result-hint {
  margin-top: 10px;
  padding: 10px 12px;
  border: 1px solid var(--warn-line);
  border-left: 3px solid var(--warn);
  border-radius: 6px;
  background: var(--warn-bg);
  color: var(--ink-2);
  font-size: 11px;
  line-height: 1.6;
}

.result-hint code {
  padding: 1px 4px;
  border-radius: 3px;
  background: var(--surface);
  font-size: 10px;
  overflow-wrap: anywhere;
}

.result-empty-body {
  padding: 20px;
  color: var(--muted);
  font-size: 12px;
}

.result-json {
  max-height: 470px;
}

/* Notes and footer nav */

.notes {
  list-style: none;
  max-width: 74ch;
  margin: 0;
}

.notes li {
  position: relative;
  padding-left: 17px;
  color: var(--ink-2);
  font-size: 13px;
  line-height: 1.6;
}

.notes li + li {
  margin-top: 7px;
}

.notes li::before {
  content: "";
  position: absolute;
  top: 8px;
  left: 2px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent-line);
}

.endpoint-nav-foot {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 38px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.pager-link {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
  padding: 11px 13px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--ink-2);
  text-decoration: none;
  transition: border-color 120ms ease, background 120ms ease;
}

.pager-link:hover {
  border-color: var(--accent-line);
  background: var(--accent-weak);
  color: var(--ink);
}

.pager-link--next {
  align-items: flex-end;
  text-align: right;
}

.pager-label {
  color: var(--faint);
  font-size: 9.5px;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.pager-name {
  display: flex;
  align-items: center;
  gap: 7px;
  max-width: 100%;
  font-size: 11.5px;
  font-weight: 550;
}

.pager-name span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pager-link svg {
  width: 12px;
  height: 12px;
  flex: none;
}

.pager-spacer {
  min-height: 1px;
}

/* Notice and states */

.notice {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 0 0 4px;
  padding: 10px 13px;
  border: 1px solid var(--warn-line);
  border-radius: var(--radius-sm);
  background: var(--warn-bg);
  color: var(--ink-2);
  font-size: 11.5px;
  line-height: 1.55;
}

.notice svg {
  width: 14px;
  height: 14px;
  margin-top: 1px;
  color: var(--warn);
}

.notice strong {
  color: var(--ink);
  font-weight: 650;
}

.notice code {
  padding: 1px 4px;
  border-radius: 3px;
  background: var(--surface);
  font-size: 10px;
}

.state-card {
  max-width: 620px;
  margin: 40px 0;
  padding: 26px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow);
}

.state-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  margin-bottom: 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--muted);
}

.state-icon svg {
  width: 18px;
  height: 18px;
}

.state-card h1,
.state-card h2 {
  margin-bottom: 6px;
  font-size: 18px;
  font-weight: 650;
  letter-spacing: -0.015em;
}

.state-card p {
  max-width: 56ch;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.65;
}

.state-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 18px;
}

.button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 34px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface);
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 550;
  text-decoration: none;
}

.button:hover {
  border-color: var(--border-strong);
  background: var(--surface-2);
  color: var(--ink);
}

.button--primary {
  border-color: transparent;
  background: var(--accent);
  color: #ffffff;
}

[data-theme="dark"] .button--primary {
  color: #06231c;
}

.button--primary:hover {
  background: var(--accent-hover);
  color: #ffffff;
}

[data-theme="dark"] .button--primary:hover {
  color: #06231c;
}

.button code {
  font-size: 10.5px;
}

.loading-panel {
  padding-top: 18px;
}

.skeleton {
  border-radius: 5px;
  background: linear-gradient(90deg, var(--surface-3) 25%, var(--surface-2) 50%, var(--surface-3) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s ease-in-out infinite;
}

.skeleton-kicker {
  width: 260px;
  height: 20px;
  margin-bottom: 18px;
}

.skeleton-title {
  width: min(420px, 70%);
  height: 32px;
  margin-bottom: 12px;
}

.skeleton-line {
  width: min(560px, 88%);
  height: 13px;
  margin-bottom: 9px;
}

.skeleton-line--short {
  width: 40%;
}

.skeleton-block {
  height: 130px;
  margin-top: 32px;
}

@keyframes shimmer {
  0% {
    background-position: 200% 0;
  }
  100% {
    background-position: -200% 0;
  }
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 120;
  max-width: calc(100vw - 32px);
  padding: 9px 14px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  background: var(--ink);
  color: var(--bg);
  box-shadow: var(--shadow);
  font-size: 12px;
  font-weight: 550;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 10px);
  transition: opacity 160ms ease, transform 160ms ease;
}

.toast.is-visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

.noscript-note {
  margin: 24px;
  padding: 16px;
  border: 1px solid var(--warn-line);
  border-radius: var(--radius);
  background: var(--warn-bg);
  color: var(--ink-2);
  font-size: 13px;
}

/* Responsive */

@media (max-width: 1240px) {
  .brand-sub {
    display: none;
  }

  .env-field {
    max-width: 260px;
  }

  .search-field {
    max-width: 260px;
  }

  .group-chip {
    display: none;
  }
}

@media (max-width: 1080px) {
  .topbar-inner {
    flex-wrap: wrap;
    gap: 10px;
  }

  .topbar-fields {
    order: 3;
    flex: 1 0 100%;
    justify-content: flex-start;
  }

  .env-field {
    flex: 1 1 50%;
    max-width: none;
  }

  .search-field {
    flex: 1 1 50%;
    max-width: none;
  }

  .topbar-actions {
    margin-left: auto;
  }
}

@media (max-width: 900px) {
  .layout {
    grid-template-columns: 250px minmax(0, 1fr);
    padding: 0 18px;
  }

  .main {
    padding-left: 24px;
  }

  .tryit-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .result-placeholder,
  .result-loading {
    min-height: 170px;
  }
}

@media (max-width: 860px) {
  .nav-toggle {
    display: grid;
  }

  .layout {
    display: block;
    padding: 0 18px;
  }

  .sidebar {
    position: fixed;

    bottom: 0;
    left: 0;
    z-index: 60;
    width: min(326px, 88vw);
    height: auto;
    padding: 14px 14px 32px;
    border-right: 1px solid var(--border);
    background: var(--surface);
    box-shadow: var(--shadow);
    transform: translateX(-104%);
    transition: transform 180ms ease;
  }

  .sidebar.is-open {
    transform: none;
  }

  .sidebar-heading {
    padding-top: 2px;
  }

  .sidebar-close {
    display: grid;
    place-items: center;
    width: 26px;
    height: 26px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--muted);
  }

  .sidebar-close:hover {
    background: var(--surface-2);
    color: var(--ink);
  }

  .sidebar-close svg {
    width: 12px;
    height: 12px;
  }

  .drawer-backdrop {
    position: fixed;
    inset: var(--topbar-h) 0 0;
    z-index: 55;
    display: block;
    border: 0;
    padding: 0;
    background: rgba(8, 18, 15, 0.44);
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms ease;
  }

  .drawer-backdrop.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  .main {
    padding: 18px 0 64px;
  }

  .endpoint-head {
    position: static;
    margin-left: 0;
    padding: 16px 0 18px;
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }

  .endpoint-nav-foot {
    margin-top: 30px;
  }
}

@media (max-width: 620px) {
  .topbar-inner {
    padding: 9px 14px;
  }

  .brand-mark {
    width: 32px;
    height: 32px;
    border-radius: 9px;
  }

  .brand-mark svg {
    width: 19px;
    height: 19px;
  }

  .brand-title {
    font-size: 14.5px;
  }

  .version-badge {
    font-size: 9.5px;
  }

  .topbar-fields {
    flex-direction: column;

    gap: 7px;
  }

  .env-field,
  .search-field {

  }

  .search-field {
    height: 38px;
  }

  .key-hint {
    display: none;
  }

  .layout {
    padding: 0 14px;
  }

  .main {
    padding-top: 14px;
  }

  .endpoint-head h1 {
    font-size: 22px;
  }

  .endpoint-summary {
    font-size: 13.5px;
  }

  .endpoint-kicker {
    gap: 8px;
  }

  .endpoint-path {
    font-size: 11.5px;
  }

  .method-badge {

  .panel-head {

es; these are live search results and are not verified by HealthAccess."]}},{"status":404,"label":"Not Found","description":"Unknown id, malformed uuid, or a request owned by another account.","headers":{"content-type":"application/json; charset=utf-8"},"body":{"error":"not_found","message":"Emergency request not found","request_id":"b1c2d3e4-f5a6-4b7c-8d9e-0f1a2b3c4d5e"}},{"status":401,"label":"Unauthorized","description":"Missing or invalid bearer token.","headers":{"content-type":"application/json; charset=utf-8"},"body":{"error":"unauthorized","message":"Authentication required","request_id":"c3d4e5f6-a7b8-4c9d-8e0f-1a2b3c4d5e6f"}}],"curl":"TOKEN=\"\u003caccess-jwt>\"\ncurl -sS http://localhost:3000/v1/emergency/0b3f6a52-9a1d-4f7e-8c2b-1d3e5f7a9b0c \\\n  -H \"authorization: Bearer $TOKEN\"","notes":["results is the persisted snapshot; it does not perform a fresh search.","Always surface the 112 guidance alongside the stored results."]}]},{"name":"Symptom analysis","description":"AI-assisted symptom intake. Create and follow-up requests run the symptom agent and return the stored symptom record and conversation; the /stream variants run the same agent and deliver the assessment as Server-Sent Events. Records are scoped to the authenticated account; ids that do not belong to the caller return 404 so ownership is not disclosed.","endpoints":[{"id":"symptom-create","name":"Create a symptom analysis","method":"POST","path":"/symptom","summary":"Send a symptom description with optional attachments and receive an AI assessment.","description":"multipart/form-data. Creates a symptom record for the authenticated account's patient profile, stores up to five attachments, runs the symptom agent with the patient's context, and returns the full conversation. The agent may set the record's name, severity and summary. Attachments must be image/* or application/pdf, max 10 MB each and max 5 files. Accounts without a patient profile get 404 not_found. When the AI provider is unconfigured the endpoint returns 503 ai_unavailable and removes the half-created record.","auth":"bearer","roles":[],"contentType":"multipart/form-data","pathParams":[],"queryParams":[],"bodyExample":null,"bodyFields":[{"name":"message","type":"string","required":true,"description":"Symptom description, trimmed length 1-8000 characters."},{"name":"includeRecords","type":"boolean","required":false,"description":"Include the patient's stored records and reviewed facility content in the AI context. Accepts true/false/1/0/yes/no/on/off. Default true."},{"name":"modifyHistory","type":"boolean","required":false,"description":"Allow the agent to update the stored name, severity and summary. Default true."},{"name":"language","type":"string","required":false,"description":"Language code for this conversation (for example en, pcm, yo, ha, ig). Defaults to the profile's preferred language, then en."},{"name":"images","type":"file[]","required":false,"description":"0-5 repeated parts, each an image/* or application/pdf file up to 10 MB. No file is embedded in this fixture."}],"responses":[{"status":201,"label":"Created","description":"Stored symptom record plus the full AI thread (Human message and AI reply).","headers":{"content-type":"application/json; charset=utf-8"},"body":{"symptom":{"id":"ab143840-0058-4486-aa0d-2faf0c88121a","patient_id":"20000000-0000-4000-8000-000000000005","account_id":"20000000-0000-4000-8000-000000000004","name":"Mild headache and runny nose","severity":"MILD","summary":"Mild headache and runny nose for two days.","include_records":true,"modify_history":true,"language":"en","files":[],"thread_id":"symptom_ab143840-0058-4486-aa0d-2faf0c88121a","model_version":"openrouter","created_at":"2026-11-17T16:13:58.179Z","updated_at":"2026-11-17T16:14:08.281Z"},"messages":[{"type":"Human","content":"I have had a mild headache and a runny nose for two days."},{"type":"AI","content":"A mild headache with a runny nose for two days is often due to a common viral infection, though other causes are possible.\n\n- Rest, drink fluids, and try saline nasal spray or a humidifier.\n- For the headache, you can consider an over-the-counter pain reliever if it’s normally safe for you; follow the label and check with a pharmacist if you’re unsure whether it’s suitable with your medicines or allergies.\n- Consider a COVID test, especially if you’ve had an exposure or will be around someone at higher risk.\n\nSeek urgent care for a sudden or severe headache, confusion, weakness, stiff neck, trouble breathing, or other rapidly worsening symptoms. Contact a healthcare professional if symptoms worsen or aren’t improving after about 10 days."}]}}],"curl":"TOKEN=\"\u003caccess-jwt>\"\ncurl -sS -X POST http://localhost:3000/v1/symptom \\\n  -H \"authorization: Bearer $TOKEN\" \\\n  -F 'message=I have had a mild headache and a runny nose for two days.' \\\n  -F 'includeRecords=true' \\\n  -F 'modifyHistory=true'","notes":["Captured live: 201 in 15.8 s with model_version \"openrouter\" (server model openai/gpt-6-luna).","messages is the whole thread on create: the Human message followed by the AI reply, which uses Markdown.","files lists object-storage keys for attachments and is [] when none were sent.","The request is synchronous; allow at least 180 s in client code."]},{"id":"symptom-stream","name":"Create a symptom analysis (streaming)","method":"POST","path":"/symptom/stream","summary":"Send a symptom description and receive the AI assessment as Server-Sent Events.","description":"multipart/form-data with the same fields, limits and validation as POST /symptom. Authentication, multipart parsing, validation, AI-configuration and patient-profile checks run before any SSE headers, so failures there return the normal JSON error with no stream and no record. Once the checks pass the server responds 200 text/event-stream, emits record first, then step and token events, then done, and closes the stream. Comments `: ping` are sent after 15 s without t>\"\ncurl -sS -N -X POST http://localhost:3000/v1/symptom/stream \\\n  -H \"authorization: Bearer $TOKEN\" \\\n  -F 'message=I have had a mild headache and a runny nose for two days.' \\\n  -F 'includeRecords=true' \\\n  -F 'modifyHistory=true'","notes":["Event order is record, then any number of step/token events, then exactly one done or error.","step payloads are { id, name, status, input?, output?, error? }; id is the LangGraph run_id and status is started, completed or failed.","token payloads are { content } and must be concatenated in arrival order to reconstruct the reply Markdown.","done payloads are { symptom, messages }; messages is the full ConversationEntry[] thread read back from the checkpointer.","error payloads are { error, message } and replace done; the connection then closes.","Text between blank lines starting with \":\" is a heartbeat and can be ignored by clients.","Use -N with curl and disable proxy buffering; the endpoint sets Cache-Control: no-cache, no-transform and X-Accel-Buffering: no."]},{"id":"symptom-list","name":"List symptom analyses","method":"GET","path":"/symptom","summary":"Paginated list of the caller's symptom records, newest first.","description":"Returns records scoped to the authenticated account, ordered by created_at descending.","auth":"bearer","roles":[],"contentType":"application/json","pathParams":[],"queryParams":[{"name":"page","type":"integer","required":false,"default":1,"description":"1-based page. Non-numeric or \u003c 1 falls back to 1; capped at 100000."},{"name":"limit","type":"integer","required":false,"default":10,"description":"Page size 1-100. Values above 100 are clamped to 100."}],"bodyExample":null,"bodyFields":[],"responses":[{"status":200,"label":"OK","description":"Current page of symptom records.","headers":{"content-type":"application/json; charset=utf-8"},"body":{"symptoms":[{"id":"ab143840-0058-4486-aa0d-2faf0c88121a","patient_id":"20000000-0000-4000-8000-000000000005","account_id":"20000000-0 clude_records":true,"modify_history":true,"language":"en","files":[],"thread_id":"symptom_ab143840-0058-4486-aa0d-2faf0c88121a","model_version":"openrouter","created_at":"2026-11-17T16:13:58.179Z","updated_at":"2026-11-17T16:14:08.281Z"},"messages":[{"type":"Human","content":"I have had a mild headache and a runny nose for two days."},{"type":"AI","content":"A mild headache with a runny nose for two days is often due to a common viral infection, though other causes are possible.\n\n- Rest, drink fluids, and try saline nasal spray or a humidifier.\n- For the headache, you can consider an over-the-counter pain reliever if it’s normally safe for you; follow the label and check with a pharmacist if you’re unsure whether it’s suitable with your medicines or allergies.\n- Consider a COVID test, especially if you’ve had an exposure or will be around someone at higher risk.\n\nSeek urgent care for a sudden or severe headache, confusion, weakness, stiff neck, trouble breathing, or other rapidly worsening symptoms. Contact a healthcare professional if symptoms worsen or aren’t improving after about 10 days."}]}},{"status":404,"label":"Not found","description":"Captured with a valid-format uuid that belongs to no record visible to this account.","headers":{"content-type":"application/json; charset=utf-8"},"body":{"error":"not_found","message":"Symptom analysis record not found","request_id":"971444ac-d52b-423a-908d-23da8b683b5e"}}],"curl":"TOKEN=\"\u003caccess-jwt>\"\nSYMPTOM_ID=\u003csymptom-id>\ncurl -sS http://localhost:3000/v1/symptom/$SYMPTOM_ID \\\n  -H \"authorization: Bearer $TOKEN\"","notes":["Non-uuid ids return the same 404 body as unknown ids rather than a 400.","messages is the stored thread for the record and grows with each follow-up."]},{"id":"symptom-follow-up","name":"Continue a symptom conversation","method":"POST","path":"/symptom/{id}/follow-up","summary":"Ask a follow-up question in an existing symptom thread.","description":"Uses the record's stored includeRecords/modifyHistory settings and the same multipart rules as create. Attachments are appended to the record's files. Unlike create, the response contains only the last two messages: the new Human message and the AI reply.","auth":"bearer","roles":[],"contentType":"multipart/form-data","pathParams":[{"name":"id","type":"uuid","required":true,"description":"Symptom analysis id."}],"queryParams":[],"bodyExample":null,"bodyFields":[{"name":"message","type":"string","required":true,"description":"Follow-up text, trimmed length 1-8000 characters."},{"name":"images","type":"file[]","required":false,"description":"0-5 image/* or application/pdf parts, max 10 MB each. No file is embedded here."}],"responses":[{"status":200,"label":"OK","description":"Updated record plus the last two thread messages.","headers":{"content-type":"application/json; charset=utf-8"},"body":{"symptom":{"id":"ab143840-0058-4486-aa0d-2faf0c88121a","patient_id":"20000000-0000-4000-8000-000000000005","account_id":"20000000-0000-4000-8000-000000000004","name":"Mild headache and runny nose","severity":"MILD","summary":"Mild headache and runny nose for two days; headache gets a little worse in the evening.","include_records":true,"modify_history":true,"language":"en","files":[],"thread_id":"symptom_ab143840-0058-4486-aa0d-2faf0c88121a","model_version":"openrouter","created_at":"2026-11-17T16:13:58.179Z","updated_at":"2026-11-17T16:14:37.432Z"},"messages":[{"type":"Human","content":"Should I be worried if the headache gets a little worse in the evening?"},{"type":"AI","content":"A slight increase in the evening **isn’t necessarily a reason to worry**. Tiredness, not drinking enough, or nasal congestion can make a mild headache feel more noticeable later in the day.\n\nTry drinking fluids, resting, and using saline spray; notice whether anything seems to trigger or relieve it. Seek urgent care for a sudden or severe headache, confusion, weakness or numbness, vision changes, a stiff neck with fever, or ation/json; charset=utf-8"},"body":{"error":"invalid_schedule","message":"Medications or a document is required","request_id":"448273ed-bd7b-4e3d-aee2-5a39cb35a6bf"}}],"curl":"TOKEN=\"\u003caccess-jwt>\"\ncurl -sS -X POST http://localhost:3000/v1/medications \\\n  -H \"authorization: Bearer $TOKEN\" \\\n  -H 'content-type: application/json' \\\n  -d '{\"title\":\"Headache relief plan\",\"description\":\"Short course for tension headache\",\"summary\":\"Paracetamol 500 mg up to three times daily for two days\",\"startDate\":\"2026-11-17\",\"endDate\":\"2026-11-19\",\"medications\":[{\"drug\":\"Paracetamol\",\"dose\":\"500 mg\",\"frequency\":\"Three times daily\",\"times\":[{\"hour\":8,\"minute\":0},{\"hour\":14,\"minute\":0},{\"hour\":20,\"minute\":0}]}]}'","notes":["Captured live: 201 in 29 ms; no model call on this path.","progress and score are strings: the capture is progress \"0\", score \"100\".","progress only counts decided moments (TAKEN or MISSED), so it stays 0 while every moment is PENDING.","The captured start_date/end_date round-trip the input calendar dates: 2026-11-17T00:00:00.000Z and 2026-11-19T00:00:00.000Z."]},{"id":"meds-schedule-create-ai","name":"Create a schedule from free text (AI-assisted)","method":"POST","path":"/medications","summary":"Let the scheduler model turn unstructured text or a document into a schedule.","description":"Used when medications is free text (or absent and a document is uploaded). The API calls the medication scheduler agent and persists its JSON draft. Explicit title/description/summary override the model's values. The same route accepts multipart/form-data with a single document file (max 10 MB) instead of JSON.","auth":"bearer","roles":[],"contentType":"application/json","pathParams":[],"queryParams":[],"bodyExample":{"startDate":"2026-11-17","endDate":"2026-11-20","medications":"Amoxicillin 500 mg three times daily for four days"},"bodyFields":[{"name":"startDate","type":"string","required":true,"description":"ISO
